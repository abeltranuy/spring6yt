spring.application.name=auth-server
server.port=9000

# Nombre propio para la cookie de sesion: si la app web y este servidor corrieran en el mismo
# host, las dos usarian JSESSIONID y se pisarian (las cookies no distinguen puertos).
server.servlet.session.cookie.name=AUTHSERVER_SESSION

# Misma base que la app de Part38: los usuarios se leen de su tabla users
spring.datasource.url=jdbc:mysql://localhost:3306/telusko?useSSL=false&serverTimezone=UTC
# En produccion definir DB_USERNAME / DB_PASSWORD como variables de entorno
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Identificador de este emisor: va en el claim "iss" de cada token
app.issuer=http://localhost:9000

# Cliente 1: la app web de Part38 (BFF). Hace login de usuarios con authorization_code + PKCE.
# La app se abre en 127.0.0.1 y no en localhost: Spring Authorization Server rechaza "localhost"
# como redirect_uri, y ademas asi las cookies de cada servidor quedan separadas.
app.web-client.id=part38-web
# Valor por defecto SOLO para desarrollo; en produccion definir AUTH_WEB_CLIENT_SECRET
app.web-client.secret=${AUTH_WEB_CLIENT_SECRET:dev-only-web-client-secret}
app.web-client.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/auth-server
app.web-client.post-logout-redirect-uri=http://127.0.0.1:8080/login.html

# Cliente 2: programas sin usuario (Postman, otro servicio). Usa client_credentials.
app.api-client.id=part38-api-client
app.api-client.secret=${AUTH_API_CLIENT_SECRET:dev-only-api-client-secret}

# Par de claves RSA con que se firman los tokens. Se genera la primera vez y se reutiliza,
# para que reiniciar este servidor no invalide los tokens ya emitidos. La carpeta esta en .gitignore.
app.jwk.path=${AUTH_JWK_PATH:./auth-server-keys/jwk.json}

app.token.access-minutes=10
app.token.refresh-hours=8

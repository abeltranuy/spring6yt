# Solo para tests: H2 en memoria con una tabla users minima, y la clave de firma dentro de target/
spring.datasource.url=jdbc:h2:mem:authtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

app.jwk.path=target/test-keys/jwk.json

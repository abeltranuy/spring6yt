# Configuracion SOLO para tests: H2 en memoria. `mvn test` no necesita MySQL ni que
# auth-server este levantado: la autenticacion se simula con spring-security-test.
spring.application.name=SpringSecurityRestAPI-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.auth-server.url=http://localhost:9000
app.auth-server.client-id=part38-web
app.auth-server.client-secret=test-only-secret

# Configuracion SOLO para tests: H2 en memoria y lista negra en memoria,
# asi `mvn test` no necesita MySQL, Redis ni un servidor levantado.
spring.application.name=SpringSecurityRestAPI-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Clave exclusiva de tests
jwt.token.secret=dGVzdC1vbmx5LWtleS1kby1ub3QtdXNlLWluLXByb2QtMDEyMzQ1Njc4OQ==
jwt.token.expires=30

app.token-blacklist.redis-enabled=false

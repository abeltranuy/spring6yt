spring.application.name=SpringSecurityRestAPI

spring.datasource.url = jdbc:mysql://localhost:3306/telusko?useSSL=false&serverTimezone=UTC
# En produccion definir DB_USERNAME / DB_PASSWORD como variables de entorno
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

# Cambiar a DEBUG para ver la cadena de filtros y las decisiones de autorizacion
logging.level.org.springframework.security=INFO

# --- Servidor de autorizacion (modulo auth-server, puerto 9000) ---
# Esta app ya no emite ni firma tokens: confia en los que emite ese servidor.
app.auth-server.url=${AUTH_SERVER_URL:http://localhost:9000}
# Credenciales de ESTA app ante el servidor de autorizacion (no son de ningun usuario).
# El valor por defecto es SOLO para desarrollo y debe coincidir con app.web-client.secret de auth-server.
app.auth-server.client-id=part38-web
app.auth-server.client-secret=${AUTH_WEB_CLIENT_SECRET:dev-only-web-client-secret}

# Abrir la app en http://127.0.0.1:8080 y NO en localhost: el servidor de autorizacion rechaza
# "localhost" como redirect_uri. login.html redirige solo si entras por localhost.

# Cookie de sesion del navegador: JavaScript no puede leerla (http-only) y no viaja en peticiones
# iniciadas por otros sitios. Tiene que ser lax y no strict: tras el login el navegador vuelve
# desde el servidor de autorizacion y la cookie debe acompanar ese regreso.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En produccion (HTTPS) poner true
server.servlet.session.cookie.secure=false

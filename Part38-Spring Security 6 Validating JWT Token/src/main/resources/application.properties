spring.application.name=SpringSecurityRestAPI

spring.datasource.url = jdbc:mysql://localhost:3306/telusko?useSSL=false&serverTimezone=UTC
# En produccion definir DB_USERNAME / DB_PASSWORD como variables de entorno
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

# Cambiar a DEBUG para ver la cadena de filtros y las decisiones de autorizacion
logging.level.org.springframework.security=INFO

#spring.security.user.name=santiago
#spring.security.user.password=1234

# JWT: clave HS256 en Base64 (minimo 256 bits).
# El valor por defecto es SOLO para desarrollo; en produccion definir la variable de entorno JWT_SECRET.
jwt.token.secret=${JWT_SECRET:owwLlCZLoJOjeJ9t03sOxfj1qeycVk+hdndWXLIZMI4=}
# Vigencia del token en minutos
jwt.token.expires=30

# Lista negra de tokens (logout). true = Redis, false = memoria (una sola instancia)
app.token-blacklist.redis-enabled=true

spring.data.redis.host = localhost
spring.data.redis.port = 6379
spring.data.redis.ssl.enabled = false
spring.data.redis.database = 0
spring.data.redis.timeout = 60000
